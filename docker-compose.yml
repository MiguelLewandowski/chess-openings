services:
  db:
    image: postgres:15
    container_name: chessopenings-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: chessopenings
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Profile "full": roda a API em Docker. Por omissão, `docker-compose up -d`
  # sobe apenas o banco — o fluxo de dev usa `pnpm dev:all` para a API com hot-reload.
  # Para tudo em Docker: `docker-compose --profile full up -d`
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chessopenings-api
    restart: always
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/chessopenings?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-chess-dev-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - db

volumes:
  postgres_data:
